[project]
name = "knowserve"
version = "0.0.0"
description = "KnowServe monorepo root (uv workspace). Not a distributable package."
requires-python = ">=3.11,<3.13"
dependencies = ["knowserve-core", "knowserve-api", "knowserve-worker"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/backend_core", "apps/api", "apps/worker"]

[tool.uv.sources]
knowserve-core = { workspace = true }
knowserve-api = { workspace = true }
knowserve-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend", "frontend", "docs", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["knowserve_core", "knowserve_api", "knowserve_worker"]

[tool.pyright]
include = ["packages", "apps", "tests", "conftest.py"]
exclude = ["**/node_modules", "**/.venv", "backend", "frontend"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "m0: tests covering M0 acceptance criteria",
    "api: API service tests",
    "worker: Worker service tests",
    "integration: needs the local PostgreSQL+pgvector database (compose db service)",
]
