[project]
name = "knowserve-api"
version = "0.0.0"
description = "KnowServe FastAPI API service."
requires-python = ">=3.11,<3.13"
dependencies = ["knowserve-core", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
knowserve-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowserve_api"]
