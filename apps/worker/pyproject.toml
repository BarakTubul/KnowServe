[project]
name = "knowserve-worker"
version = "0.0.0"
description = "KnowServe Worker service (signed QStash deliveries, outbox dispatcher)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "knowserve-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-auth>=2.35",
    "requests>=2.32",
]

[tool.uv.sources]
knowserve-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowserve_worker"]
