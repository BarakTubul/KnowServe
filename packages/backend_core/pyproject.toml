[project]
name = "knowserve-core"
version = "0.0.0"
description = "Focused shared backend code used by the API and the Worker (settings, DB, logging, errors, jobs/outbox)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "google-auth>=2.35",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowserve_core"]
