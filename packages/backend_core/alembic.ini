[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# The database URL is read from KS_DATABASE_URL by migrations/env.py. Never put credentials here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
