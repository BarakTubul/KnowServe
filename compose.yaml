# Local development stack (INFRA-01). Local-only credentials; never reuse them anywhere else.
# Each workstream edits only its own service block (docs/milestones/M0/tasks.md "Conflict rules").
name: knowserve

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowserve
      POSTGRES_PASSWORD: knowserve_local_only
      POSTGRES_DB: knowserve
    ports:
      # 5433 on the host avoids clashing with a developer's own PostgreSQL on 5432.
      - "${KS_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/local/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowserve -d knowserve"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Backend workstream owns: migrate, api ---
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "packages/backend_core/alembic.ini", "upgrade", "head"]
    environment:
      KS_DATABASE_URL: postgresql+asyncpg://knowserve:knowserve_local_only@db:5432/knowserve
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      KS_ENV: local
      KS_DATABASE_URL: postgresql+asyncpg://knowserve:knowserve_local_only@db:5432/knowserve
      KS_API_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- Worker workstream owns: worker ---
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      KS_ENV: local
      KS_DATABASE_URL: postgresql+asyncpg://knowserve:knowserve_local_only@db:5432/knowserve
      KS_QSTASH_CURRENT_SIGNING_KEY: local-only-qstash-current-key-not-a-secret
      KS_QSTASH_NEXT_SIGNING_KEY: local-only-qstash-next-key-not-a-secret
      KS_DISPATCHER_LOCAL_TOKEN: local-only-dispatcher-token-not-a-secret
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
